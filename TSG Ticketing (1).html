<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSG Ticketing</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f8;--card:#fff;--ink:#1d2b33;--mute:#6b7c86;--line:#e3e9ec;--acc:#0f7b8a;--accbg:#e2f3f5;--hi:#d9534f;--md:#e29a1d;--lo:#5a9e6f;--field:#f1f4f6;--men:#fff3cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191c;--card:#1c2327;--ink:#e6edf0;--mute:#8fa0a9;--line:#2b353a;--acc:#4fc1d0;--accbg:#173a40;--field:#242d32;--men:#4a3d12}}
:root[data-theme="dark"]{--bg:#14191c;--card:#1c2327;--ink:#e6edf0;--mute:#8fa0a9;--line:#2b353a;--acc:#4fc1d0;--accbg:#173a40;--field:#242d32;--men:#4a3d12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:18px;margin:0}
.as{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:2px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;cursor:pointer;color:var(--mute);font-weight:500;white-space:nowrap}
.tab.on{color:var(--acc);border-color:var(--acc);font-weight:600}
.badge{background:var(--hi);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:5px}
main{padding:20px 24px 50px;max-width:1100px;margin:0 auto}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--acc)}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.f{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.f:focus{background:var(--card);border-color:var(--acc)}.f:disabled{background:transparent;border-color:transparent;padding-left:0;opacity:1;-webkit-text-fill-color:var(--ink)}
textarea.f{min-height:80px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.scroll{overflow-x:auto}.list{min-width:720px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.row{display:grid;grid-template-columns:80px 2fr 1.2fr 1.3fr 80px;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}.row:hover:not(.head){background:var(--field)}.head{cursor:default;color:var(--mute);font-size:13px;font-weight:600}
.t{font-weight:600}.t small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--accbg);color:var(--acc);white-space:nowrap}
.st.s2{background:#fdf0d5;color:#9a6700}.st.s3,.st.s4{background:#e0f2e6;color:#2e7a47}
.pri{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.steps{display:flex;gap:4px;margin:4px 0 18px}.step{flex:1;text-align:center;font-size:12px;padding:7px 2px;background:var(--field);color:var(--mute);border-radius:6px}
.step.on{background:var(--acc);color:#fff;font-weight:600}.step.past{background:var(--accbg);color:var(--acc)}
.wait{background:var(--accbg);color:var(--acc);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}
.gate li{list-style:none;padding:2px 0;color:var(--mute)}.gate li.ok{color:var(--lo)}.gate ul{margin:0 0 12px;padding:0}
.drop{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px dashed var(--acc);background:var(--accbg);border-radius:12px;padding:20px;text-align:center;cursor:pointer;margin-bottom:12px;color:var(--acc)}.drop.over{background:var(--card)}.file a{color:var(--ink)}.file{display:inline-flex;gap:8px;align-items:center;background:var(--field);border-radius:8px;padding:6px 10px;margin:0 6px 6px 0;font-size:13px}
.file img{width:34px;height:34px;object-fit:cover;border-radius:4px}.file button{background:none;border:0;cursor:pointer;color:var(--mute);font-size:16px}
.cm{display:flex;gap:10px;margin-bottom:12px}.av{width:30px;height:30px;border-radius:50%;background:var(--accbg);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.cm span{color:var(--mute);font-size:12px;margin-left:6px}.cm p{margin:2px 0 0;white-space:pre-wrap}
.m{background:var(--men);border-radius:4px;padding:0 3px;font-weight:600}
.mrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.mrow button{border:1px dashed var(--acc);background:none;color:var(--acc);border-radius:99px;padding:2px 10px;font-size:12.5px;cursor:pointer}
.sub{color:var(--mute);font-size:13px}.back{background:none;border:0;color:var(--acc);cursor:pointer;padding:0;margin-bottom:10px;font-weight:600}
pre{background:var(--field);padding:14px;border-radius:8px;overflow:auto;font-size:12.5px;line-height:1.45}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}td,th{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:600}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}.toast.on{opacity:1}
@media(max-width:600px){.top,.tabs,main{padding-left:12px;padding-right:12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><h1>TSG Ticketing</h1><div class="as"><label for="me" style="margin:0">Viewing as</label><select id="me" class="f" style="width:auto"></select><button class="btn" data-a="theme">Dark mode</button></div></div>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>
<script>
var ROLE={sd:"Service Desk",lead:"Team Leader",eng:"Engineer"},GROUPS={TSG:["lead","eng"],Leads:["lead"],Engineers:["eng"],ServiceDesk:["sd"]};
var STEPS=["With team leader","With engineer","For validation","Validated","Closed"];
var P=[{n:"Sebastien Vince Martinez",r:"sd"},{n:"Chan",r:"lead"},{n:"Baste",r:"lead"},{n:"Rico Mar Nonato",r:"eng"},{n:"Vencent Red",r:"eng"},{n:"Ella Camille Oracoy",r:"eng"},{n:"Sydrian S. Saez",r:"eng"}];
var T=[
{id:44825,subj:"Vision One onsite audit",co:"Megaworld",brand:"Trend Micro",pri:"High",svc:"Onsite",desc:"Quarterly audit of endpoint agents.",eng:"Vencent Red",lead:"Chan",st:2,actions:"Checked agent versions, updated policies.",resolution:"All endpoints compliant. 3 agents upgraded.",hrs:"3",files:[{n:"audit-report.pdf",sz:"182 KB"}],by:"Sebastien Vince Martinez",created:"Oct 02, 2026",cm:[{a:"Vencent Red",t:"3:10 PM",m:"@Leads ready for validation.",seen:{}}]},
{id:44824,subj:"CSD-TSG-BENCH-PAL-TREND MICRO-MA",co:"Philippine Airlines (PAL)",brand:"Trend Micro",pri:"Low",svc:"Maintenance Agreement",desc:"Bench activity. Checking MQTT failed connection.",eng:"Rico Mar Nonato",lead:"Chan",st:1,actions:"Isolated unit and captured connection logs.",resolution:"",hrs:"",files:[],by:"Sebastien Vince Martinez",created:"Oct 02, 2026",cm:[{a:"Chan",t:"2:47 PM",m:"@Rico Mar Nonato please update.",seen:{}}]},
{id:44823,subj:"CSD-TSG-BENCH-PAL-TREND MICRO",co:"Philippine Airlines (PAL)",brand:"Trend Micro",pri:"Low",svc:"Maintenance Agreement",desc:"Parent ticket for PAL bench activity.",eng:"Vencent Red",lead:"Baste",st:0,actions:"",resolution:"",hrs:"",files:[],by:"Sebastien Vince Martinez",created:"Oct 02, 2026",cm:[]}];
var me=0,tab="tickets",filter="All",open=null,$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove("on")},2000)}
function tk(){return T.filter(function(t){return t.id==open})[0]}
function mentioned(c,p){return Object.keys(GROUPS).some(function(g){return c.m.indexOf("@"+g)>-1&&GROUPS[g].indexOf(p.r)>-1})||c.m.indexOf("@"+p.n)>-1}
function unseen(){var p=P[me],n=0;T.forEach(function(t){t.cm.forEach(function(c){if(c.a!=p.n&&mentioned(c,p)&&!c.seen[p.n])n++})});return n}
function hl(s){var tokens=Object.keys(GROUPS).concat(P.map(function(p){return p.n})).sort(function(a,b){return b.length-a.length}).map(function(x){return"@"+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")});
 return esc(s).replace(new RegExp(tokens.join("|"),"g"),function(x){return'<span class="m">'+x+'</span>'})}
function ini(n){return n.split(" ").map(function(w){return w[0]}).join("").slice(0,2)}
function can(t,f){var p=P[me];
 if(f=="actions")return t.st==0&&p.r=="lead";
 if(f=="files")return(t.st==0&&p.r=="lead")||(t.st==1&&p.n==t.eng);
 return t.st==1&&p.n==t.eng}
function missing(t){var m=[];if(!t.actions.trim())m.push("Actions taken");if(!t.resolution.trim())m.push("Resolution");if(!(+t.hrs>0))m.push("Hours spent");if(!t.files.length)m.push("Technical report attached");return m}
function nav(){var tabs=[["tickets","Tickets"]];if(P[me].r=="sd")tabs.push(["create","New ticket"]);tabs.push(["mentions","Mentions"],["people","People"],["kintone","Kintone setup"]);
 $("tabs").innerHTML=tabs.map(function(x){var b=x[0]=="mentions"&&unseen()?'<span class="badge">'+unseen()+'</span>':"";return'<button class="tab '+(tab==x[0]?"on":"")+'" data-a="tab" data-v="'+x[0]+'">'+x[1]+b+'</button>'}).join("")}
function render(){$("me").innerHTML=P.map(function(p,i){return'<option value="'+i+'"'+(i==me?" selected":"")+'>'+esc(p.n)+' ('+ROLE[p.r]+')</option>'}).join("");nav();
 var v=$("main");if(tab=="tickets")v.innerHTML=open?detail():list();else if(tab=="create")v.innerHTML=create();else if(tab=="people")v.innerHTML=people();else if(tab=="mentions")v.innerHTML=mentions();else v.innerHTML=kintone()}
function list(){var p=P[me],q=($("q")||{}).value||"";
 var r=T.filter(function(t){return(p.r!="eng"||t.eng==p.n)&&(filter=="All"||STEPS[t.st]==filter)});
 var h='<div class="chips">'+["All"].concat(STEPS).map(function(s){return'<button class="chip" aria-pressed="'+(filter==s)+'" data-a="fil" data-v="'+s+'">'+s+'</button>'}).join("")+'</div>';
 var mine=T.filter(function(t){return(p.r=="lead"&&(t.st==0||t.st==2))||(p.r=="eng"&&t.st==1&&t.eng==p.n)||(p.r=="sd"&&t.st==3)}).length;
 h+='<p class="sub">'+(mine?'<b>'+mine+' ticket'+(mine>1?"s":"")+' waiting for you.</b> ':"Nothing waiting for you. ")+r.length+' shown.</p>';
 h+='<div class="scroll"><div class="list"><div class="row head"><div>ID</div><div>Ticket</div><div>Engineer</div><div>Status</div><div>Priority</div></div>';
 if(!r.length)h+='<div class="row head" style="cursor:default">No tickets here yet.</div>';
 r.forEach(function(t){h+='<div class="row" tabindex="0" data-a="open" data-v="'+t.id+'"><div class="sub">#'+t.id+'</div><div class="t">'+esc(t.subj)+'<small>'+esc(t.co)+' · '+esc(t.brand)+'</small></div><div>'+esc(t.eng)+'<div class="sub">Lead: '+esc(t.lead)+'</div></div><div><span class="st s'+t.st+'">'+STEPS[t.st]+'</span></div><div><span class="pri" style="background:'+({High:"var(--hi)",Medium:"var(--md)",Low:"var(--lo)"})[t.pri]+'"></span>'+t.pri+'</div></div>'});
 return h+'</div></div>'}
function opt(a,v){return a.map(function(o){return'<option'+(o==v?" selected":"")+'>'+esc(o)+'</option>'}).join("")}
function names(r){return P.filter(function(p){return p.r==r}).map(function(p){return p.n})}
function create(){return'<div class="card"><h3>Create a ticket</h3><div class="grid"><div class="full"><label>Ticket ID</label><input class="f" disabled value="#'+(Math.max.apply(null,T.map(function(t){return t.id}))+1)+' (assigned automatically)"></div>'
 +'<div class="full"><label for="n-subj">Subject</label><input class="f" id="n-subj"></div><div><label for="n-co">Company</label><input class="f" id="n-co"></div><div><label for="n-brand">Brand</label><input class="f" id="n-brand"></div>'
 +'<div><label for="n-pri">Priority</label><select class="f" id="n-pri">'+opt(["Low","Medium","High"],"Medium")+'</select></div><div><label for="n-svc">Service type</label><select class="f" id="n-svc">'+opt(["Maintenance Agreement","Warranty","Onsite","Remote","Repair"])+'</select></div>'
 +'<div><label for="n-eng">Assign to engineer</label><select class="f" id="n-eng">'+opt(names("eng"))+'</select></div><div><label for="n-lead">Forward to team leader</label><select class="f" id="n-lead">'+opt(names("lead"))+'</select></div>'
 +'<div class="full"><label for="n-desc">Reported problem / request</label><textarea class="f" id="n-desc"></textarea></div></div><p><button class="btn p" data-a="create">Create and forward to team leader</button></p></div>'}
function detail(){var t=tk(),p=P[me],h='<button class="back" data-a="close">&larr; All tickets</button><div class="card"><h3>#'+t.id+' · '+esc(t.subj)+'</h3><div class="steps">'
 +STEPS.map(function(s,i){return'<div class="step '+(i==t.st?"on":i<t.st?"past":"")+'">'+s+'</div>'}).join("")+'</div>';
 var w={0:"Waiting on team leader "+t.lead+" to add actions taken and reports.",1:"Waiting on engineer "+t.eng+" to complete the update.",2:"Waiting on a team leader to validate.",3:"Validated. Waiting on Service Desk to close.",4:"This ticket is closed."}[t.st];
 h+='<div class="wait">'+w+'</div><div class="grid"><div><label>Company</label><div>'+esc(t.co)+'</div></div><div><label>Brand</label><div>'+esc(t.brand)+'</div></div><div><label>Priority / service</label><div>'+t.pri+' · '+esc(t.svc)+'</div></div><div><label>Created by</label><div>'+esc(t.by)+' · '+t.created+'</div></div><div><label>Engineer</label><div>'+esc(t.eng)+'</div></div><div><label>Team leader</label><div>'+esc(t.lead)+'</div></div><div class="full"><label>Reported problem</label><div>'+esc(t.desc)+'</div></div></div></div>';
 h+='<div class="card"><h3>Action and report</h3><div class="grid"><div class="full"><label for="k-actions">Actions taken (team leader)</label><textarea class="f" id="k-actions" data-k="actions" '+(can(t,"actions")?"":"disabled")+'>'+esc(t.actions)+'</textarea></div>'
 +'<div class="full"><label for="k-resolution">Resolution / update (engineer)</label><textarea class="f" id="k-resolution" data-k="resolution" '+(can(t,"res")?"":"disabled")+'>'+esc(t.resolution)+'</textarea></div>'
 +'<div><label for="k-hrs">Hours spent (engineer)</label><input class="f" type="number" min="0" step="0.5" id="k-hrs" data-k="hrs" value="'+esc(t.hrs)+'" '+(can(t,"res")?"":"disabled")+'></div></div>'
 +'<h3 style="margin-top:16px">Technical report attachments</h3>'
 +(can(t,"files")?'<label class="drop" id="drop" for="up"><b>Attach technical report</b><span class="sub">Click to browse or drag files here. PDF, Word, Excel or images.</span><input type="file" id="up" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,image/*" hidden></label>':'<p class="sub">'+(t.st<2?"Attachments can be added by the person this ticket is waiting on.":"Attachments are locked after the engineer forwards the ticket.")+'</p>')
 +'<div>'+(t.files.map(function(f,i){var nm=esc(f.n);return'<span class="file">'+(f.url&&f.img?'<img src="'+f.url+'" alt="">':"📄")+(f.url?'<a href="'+f.url+'" target="_blank" rel="noopener" download="'+nm+'">'+nm+'</a>':nm)+' <span class="sub">'+esc(f.sz)+'</span>'+(can(t,"files")?'<button data-a="rm" data-v="'+i+'" aria-label="Remove">&times;</button>':"")+'</span>'}).join("")||'<span class="sub">No files attached yet.</span>')+'</div>'
 +'<div id="gate">'+gate(t)+'</div></div>';
 h+='<div class="card"><h3>Messages</h3>'+(t.cm.map(function(c){return'<div class="cm"><div class="av">'+esc(ini(c.a))+'</div><div><b>'+esc(c.a)+'</b><span>'+esc(c.t)+'</span><p>'+hl(c.m)+'</p></div></div>'}).join("")||'<p class="sub">No messages yet. Mention a group or lead to get their attention.</p>')
 +'<textarea class="f" id="nc" placeholder="Write a message. Use the buttons to mention."></textarea><div class="mrow"><span class="sub">Mention:</span>'+Object.keys(GROUPS).map(function(g){return'<button data-a="men" data-v="@'+g+'">@'+g+'</button>'}).join("")+P.filter(function(x){return x.r=="lead"}).map(function(x){return'<button data-a="men" data-v="@'+esc(x.n)+'">@'+esc(x.n)+'</button>'}).join("")+P.filter(function(x){return x.r=="eng"&&x.n==t.eng}).map(function(x){return'<button data-a="men" data-v="@'+esc(x.n)+'">@'+esc(x.n)+'</button>'}).join("")+'</div><button class="btn p" data-a="post">Send message</button></div>';
 return h}
function gate(t){var p=P[me],h="",m=missing(t);
 if(t.st==0&&p.r=="lead")h='<button class="btn p" data-a="go" data-v="1" '+(t.actions.trim()?"":"disabled")+'>Submit to engineer</button>'+(t.actions.trim()?"":' <span class="sub">Add actions taken first.</span>');
 else if(t.st==1&&p.n==t.eng)h='<ul>'+["Actions taken","Resolution","Hours spent","Technical report attached"].map(function(x){return'<li class="'+(m.indexOf(x)<0?"ok":"")+'">'+(m.indexOf(x)<0?"✓ ":"○ ")+x+'</li>'}).join("")+'</ul><button class="btn p" data-a="go" data-v="2" '+(m.length?"disabled":"")+'>Forward to leads for validation</button>'+(m.length?' <span class="sub">Complete all fields to continue.</span>':"");
 else if(t.st==2&&p.r=="lead")h='<button class="btn p" data-a="go" data-v="3">Validate</button> <button class="btn" data-a="go" data-v="1">Send back to engineer</button>';
 else if(t.st==3&&p.r=="sd")h='<button class="btn p" data-a="go" data-v="4">Close ticket</button>';
 return h?'<div class="gate" style="margin-top:14px">'+h+'</div>':""}
function people(){var h='<div class="card"><h3>Team</h3>';
 ["sd","lead","eng"].forEach(function(r){h+='<p class="sub" style="margin:12px 0 4px">'+ROLE[r]+'s</p>'+P.filter(function(p){return p.r==r}).map(function(p){return'<span class="file">'+esc(p.n)+(P[me].r!="eng"&&P.length>2?'<button data-a="delp" data-v="'+esc(p.n)+'" aria-label="Remove '+esc(p.n)+'">&times;</button>':"")+'</span>'}).join("")});
 h+='</div>';if(P[me].r!="eng")h+='<div class="card"><h3>Add a person</h3><div class="grid"><div><label for="p-n">Name</label><input class="f" id="p-n"></div><div><label for="p-r">Role</label><select class="f" id="p-r"><option value="eng">Engineer</option><option value="lead">Team Leader</option><option value="sd">Service Desk</option></select></div></div><p><button class="btn p" data-a="addp">Add person</button></p></div>';return h}
function mentions(){var p=P[me],r=[];T.forEach(function(t){t.cm.forEach(function(c){if(c.a!=p.n&&mentioned(c,p))r.push([t,c])})});
 return'<div class="card"><h3>Messages that mention you or your group</h3>'+(r.map(function(x){var n=!x[1].seen[p.n];x[1].seen[p.n]=1;return'<div class="cm"><div class="av">'+esc(ini(x[1].a))+'</div><div><b>'+esc(x[1].a)+'</b><span>#'+x[0].id+' · '+x[1].t+(n?" · new":"")+'</span><p>'+hl(x[1].m)+'</p><button class="back" data-a="open" data-v="'+x[0].id+'">Open ticket</button></div></div>'}).join("")||'<p class="sub">No mentions yet.</p>')+'</div>'}
var JS="(function(){\n  'use strict';\n  kintone.events.on('app.record.detail.process.proceed', function(event){\n    if (event.action.value !== 'Forward for validation') return event;\n    var r = event.record, miss = [];\n    if (!r.actions_taken.value) miss.push('Actions taken');\n    if (!r.resolution.value) miss.push('Resolution');\n    if (!(Number(r.hours_spent.value) > 0)) miss.push('Hours spent');\n    if (r.reports.value.length === 0) miss.push('Technical report');\n    if (miss.length) {\n      alert('Complete first: ' + miss.join(', '));\n      return false; // blocks the action\n    }\n    return event;\n  });\n})();";
